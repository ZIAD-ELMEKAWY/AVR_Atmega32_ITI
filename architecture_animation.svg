<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');

      .layer { opacity: 0; animation: slideIn 0.8s ease forwards; }
      .layer-app   { animation-delay: 0.2s; }
      .layer-hal   { animation-delay: 0.8s; }
      .layer-mcal  { animation-delay: 1.4s; }
      .layer-lib   { animation-delay: 2.0s; }

      .arrow { opacity: 0; animation: fadeIn 0.5s ease forwards; }
      .arrow-1 { animation-delay: 0.6s; }
      .arrow-2 { animation-delay: 1.2s; }
      .arrow-3 { animation-delay: 1.8s; }

      .label { opacity: 0; animation: fadeIn 0.5s ease forwards; }
      .label-1 { animation-delay: 0.5s; }
      .label-2 { animation-delay: 1.1s; }
      .label-3 { animation-delay: 1.7s; }
      .label-4 { animation-delay: 2.3s; }

      @keyframes slideIn {
        from { opacity: 0; transform: translateX(-40px); }
        to   { opacity: 1; transform: translateX(0); }
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }

      .glow-app   { filter: drop-shadow(0 0 6px #4fc3f7); }
      .glow-hal   { filter: drop-shadow(0 0 6px #81c784); }
      .glow-mcal  { filter: drop-shadow(0 0 6px #ffb74d); }
      .glow-lib   { filter: drop-shadow(0 0 6px #e57373); }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="320" rx="12" fill="#0d1117"/>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" fill="#c9d1d9" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">
    ⚡ Layered Software Architecture
  </text>

  <!-- APP Layer -->
  <g class="layer layer-app">
    <rect x="100" y="45" width="400" height="50" rx="8" fill="#1e3a5f" stroke="#4fc3f7" stroke-width="2" class="glow-app"/>
    <text x="300" y="68" text-anchor="middle" fill="#4fc3f7" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">APP (Application)</text>
    <text x="300" y="85" text-anchor="middle" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="9">main.c · System Integration</text>
  </g>

  <!-- Arrow 1 -->
  <g class="arrow arrow-1">
    <line x1="300" y1="95" x2="300" y2="108" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="3,2"/>
    <polygon points="296,105 300,112 304,105" fill="#8b949e"/>
  </g>

  <!-- HAL Layer -->
  <g class="layer layer-hal">
    <rect x="100" y="115" width="400" height="50" rx="8" fill="#1e3a2f" stroke="#81c784" stroke-width="2" class="glow-hal"/>
    <text x="300" y="138" text-anchor="middle" fill="#81c784" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">HAL (Hardware Abstraction)</text>
    <text x="300" y="155" text-anchor="middle" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="9">LED · SSD · LCD · KEYPAD · MOTOR</text>
  </g>

  <!-- Arrow 2 -->
  <g class="arrow arrow-2">
    <line x1="300" y1="165" x2="300" y2="178" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="3,2"/>
    <polygon points="296,175 300,182 304,175" fill="#8b949e"/>
  </g>

  <!-- MCAL Layer -->
  <g class="layer layer-mcal">
    <rect x="100" y="185" width="400" height="50" rx="8" fill="#3a2e1e" stroke="#ffb74d" stroke-width="2" class="glow-mcal"/>
    <text x="300" y="208" text-anchor="middle" fill="#ffb74d" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">MCAL (Microcontroller Abstraction)</text>
    <text x="300" y="225" text-anchor="middle" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="9">DIO · EXTI · GIE · ADC · TIMER · USART · SPI · TWI · WDT</text>
  </g>

  <!-- Arrow 3 -->
  <g class="arrow arrow-3">
    <line x1="300" y1="235" x2="300" y2="248" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="3,2"/>
    <polygon points="296,245 300,252 304,245" fill="#8b949e"/>
  </g>

  <!-- LIB Layer -->
  <g class="layer layer-lib">
    <rect x="100" y="255" width="400" height="50" rx="8" fill="#3a1e1e" stroke="#e57373" stroke-width="2" class="glow-lib"/>
    <text x="300" y="278" text-anchor="middle" fill="#e57373" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">LIB (Libraries / Common)</text>
    <text x="300" y="295" text-anchor="middle" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="9">STD_Types · BIT_Math</text>
  </g>

  <!-- Side Labels -->
  <g class="label label-1">
    <text x="520" y="72" fill="#4fc3f7" font-family="'JetBrains Mono', monospace" font-size="10" opacity="0.7">Layer 4</text>
  </g>
  <g class="label label-2">
    <text x="520" y="142" fill="#81c784" font-family="'JetBrains Mono', monospace" font-size="10" opacity="0.7">Layer 3</text>
  </g>
  <g class="label label-3">
    <text x="520" y="212" fill="#ffb74d" font-family="'JetBrains Mono', monospace" font-size="10" opacity="0.7">Layer 2</text>
  </g>
  <g class="label label-4">
    <text x="520" y="282" fill="#e57373" font-family="'JetBrains Mono', monospace" font-size="10" opacity="0.7">Layer 1</text>
  </g>
</svg>